[package]
name = "betty-camera"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.42", features = ["full"] }
bytes = "1.4"
v4l = "0.14"
image = "0.24"
ndarray = "0.17"
tract-onnx = "0.23"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest = { version = "0.11", default-features = false,  features = ["json", "rustls-tls", "blocking"] }
serde_json = "1.0"
dotenvy = "0.15"