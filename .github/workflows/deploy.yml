name: Deploy to Raspberry Pi

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: apps/betty-server

      - name: Run tests
        run: npm run betty-server:test

  deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci
        working-directory: apps/betty-server

      - name: Build production bundle
        run: npm run betty-server:build

      - name: Restart with PM2
        run: |
          pm2 restart betty-server || pm2 start ecosystem.config.js

      - name: Health check
        run: |
          sleep 5
          curl -f http://localhost:3000/api/health || exit 1
