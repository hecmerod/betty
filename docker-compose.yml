services:
  betty-server:
    build:
      context: .
      dockerfile: apps/betty-server/Dockerfile
    container_name: betty-server
    depends_on:
      betty-db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - apps/betty-server/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CAMERA_SERVICE_URL=http://betty-camera:8001/camera
      - DATABASE_URL=postgresql://betty:${POSTGRES_PASSWORD}@betty-db:5432/betty
    networks:
      - betty-network

  betty-camera:
    build:
      context: .
      dockerfile: apps/betty-camera/Dockerfile
    image: betty-camera:final
    container_name: betty-camera
    restart: unless-stopped
    privileged: true
    ports:
      - "8001:8001"
    volumes:
      # Montajes necesarios para acceso completo a la cámara Raspberry Pi
      - /opt/vc:/opt/vc
      - /dev:/dev
      - /sys:/sys
      - /proc:/proc
      - /run/udev:/run/udev:ro
      - /lib/firmware:/lib/firmware:ro
      - /usr/share/libcamera:/usr/share/libcamera:ro
    device_cgroup_rules:
      # Reglas de dispositivos para acceso a cámara y hardware
      - 'c 81:* rmw'   # Video devices
      - 'c 235:* rmw'  # Media devices
      - 'c 236:* rmw'  # Additional media devices
    env_file:
      - apps/betty-camera/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app/src
      - BETTY_SERVER_URL=http://betty-server:3000/api
    networks:
      - betty-network

  betty-db:
    image: postgres:16-alpine
    container_name: betty-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - betty-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betty -d betty"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - betty-network

  betty-db-backup:
    image: postgres:16-alpine
    container_name: betty-db-backup
    restart: unless-stopped
    user: "0:0"  # Ejecutar como root para tener permisos de escritura
    depends_on:
      betty-db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./backups/db:/backups
      - ./scripts/backup-db.sh:/backup-db.sh:ro
    entrypoint: /bin/sh
    command: 
      - -c
      - |
        chmod 777 /backups
        echo "0 3 * * * /backup-db.sh >> /var/log/backup.log 2>&1" | crontab -
        crond -f -l 2
    networks:
      - betty-network
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8002:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped
    command:
      - '--housekeeping_interval=60s'

networks:
  betty-network:
    driver: bridge

volumes:
  betty-db-data:
    driver: local
